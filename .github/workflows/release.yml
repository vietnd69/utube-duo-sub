name: Release

# Publishes youtube-duo-sub-<version>.zip as a GitHub release whenever main
# carries a manifest version that has no release yet. Bumping the version and
# pushing to main is all a release needs; the tag is created here.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        run: npm run check
      - if: steps.version.outputs.exists == 'false'
        run: npm run package
      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
