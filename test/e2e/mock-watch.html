<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mock YouTube watch page</title>
<style>
  body { margin: 0; background: #000; font-family: Roboto, Arial, sans-serif; }
  #movie_player { position: relative; width: 960px; height: 540px; background: #222; overflow: hidden; }
  video { width: 100%; height: 100%; }
  .ytp-chrome-bottom { position: absolute; left: 12px; right: 12px; bottom: 0; height: 48px; }
  .ytp-right-controls { position: absolute; right: 0; top: 0; height: 48px; display: flex; }
  .ytp-button { width: 48px; height: 48px; background: none; border: 0; color: #fff; padding: 0; }
  .ytp-caption-window-container { position: absolute; inset: 0; pointer-events: none; }
  .caption-window { position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); }
  .ytp-caption-segment { display: inline-block; white-space: pre-wrap; padding: 0 0.25em;
    background: rgba(8, 8, 8, 0.75); color: rgb(255, 255, 0); font-size: 30px;
    font-family: "Courier New", monospace; text-shadow: rgb(34, 34, 34) 2px 2px 3px; }
  .ytp-settings-menu { position: absolute; right: 12px; bottom: 60px; width: 300px; height: 300px;
    background: rgba(28, 28, 28, 0.9); color: #eee; overflow: hidden; z-index: 70; }
  .ytp-panel { position: absolute; top: 0; left: 0; overflow-y: auto; }
  .ytp-panel-menu { display: table; width: 100%; }
  .ytp-menuitem { display: table-row; height: 40px; cursor: pointer; }
  .ytp-menuitem-label, .ytp-menuitem-content, .ytp-menuitem-icon { display: table-cell; vertical-align: middle; padding: 0 15px; }
</style>
</head>
<body>
<div id="movie_player" class="html5-video-player">
  <video class="html5-main-video"></video>
  <div class="ytp-caption-window-container">
    <div class="caption-window"><span class="captions-text"><span class="caption-visual-line"><span class="ytp-caption-segment">native caption</span></span></span></div>
  </div>
  <div class="ytp-chrome-bottom">
    <div class="ytp-right-controls">
      <button class="ytp-button ytp-subtitles-button" aria-pressed="true">CC</button>
      <button class="ytp-button ytp-settings-button">⚙</button>
    </div>
  </div>
  <div class="ytp-popup ytp-settings-menu" style="display: none;"><div class="ytp-popup-content"></div></div>
</div>
<script>
  // Minimal stand-in for YouTube's player API.
  const player = document.getElementById('movie_player');
  const tracks = [
    { languageCode: 'en', kind: 'asr', vssId: 'a.en', name: { simpleText: 'English (auto-generated)' }, isTranslatable: true,
      baseUrl: 'https://www.youtube.com/api/timedtext?v=test123&lang=en&kind=asr&signature=SIG_EN' },
    { languageCode: 'fr', vssId: '.fr', name: { simpleText: 'French' }, isTranslatable: true,
      baseUrl: 'https://www.youtube.com/api/timedtext?v=test123&lang=fr&signature=SIG_FR' }
  ];
  window.mockTrack = { languageCode: 'en', kind: 'asr', vss_id: 'a.en', translationLanguage: { languageCode: 'vi', languageName: 'Vietnamese' } };
  window.setOptionCalls = [];
  Object.assign(player, {
    getVideoData: () => ({ video_id: 'test123' }),
    getPlayerResponse: () => ({
      videoDetails: { videoId: 'test123' },
      captions: { playerCaptionsTracklistRenderer: {
        captionTracks: tracks,
        translationLanguages: [
          { languageCode: 'vi', languageName: { simpleText: 'Vietnamese' } },
          { languageCode: 'ja', languageName: { simpleText: 'Japanese' } }
        ]
      } }
    }),
    getOption: (mod, name) => {
      if (name === 'track') return window.mockTrack;
      if (name === 'tracklist') return [
        { languageCode: 'en', kind: 'asr', vss_id: 'a.en', displayName: 'English (auto-generated)' },
        { languageCode: 'fr', kind: '', vss_id: '.fr', displayName: 'French' }
      ];
      return null;
    },
    setOption: (mod, name, value) => { window.setOptionCalls.push(value); window.mockTrack = value; },
    loadModule: () => {},
    getSubtitlesUserSettings: () => ({ color: '#ff0', fontSizeIncrement: 0 })
  });
  // Settings popup: like YouTube, every navigation rebuilds the shown panel.
  const popup = player.querySelector('.ytp-settings-menu');
  const node = (tag, cls, text) => {
    const n = document.createElement(tag);
    n.className = cls;
    if (text) n.textContent = text;
    return n;
  };
  window.showPanel = (kind) => {
    const panel = node('div', 'ytp-panel');
    panel.style.width = '300px';
    panel.style.height = '300px';
    const header = node('div', 'ytp-panel-header');
    header.append(node('span', 'ytp-panel-title', kind === 'captions' ? 'Phụ đề' : 'Tùy chọn'));
    const list = node('div', 'ytp-panel-menu');
    if (kind === 'captions') {
      header.append(node('button', 'ytp-button ytp-panel-options', 'Tùy chọn'));
      for (const label of ['Tắt', 'English (auto-generated)', 'French', 'Tự động dịch']) {
        const item = node('div', 'ytp-menuitem');
        item.setAttribute('role', 'menuitemradio');
        item.append(node('div', 'ytp-menuitem-label', label));
        list.append(item);
      }
    } else {
      for (const label of ['Phông chữ', 'Màu phông chữ', 'Cỡ phông chữ']) {
        const item = node('div', 'ytp-menuitem ytp-subtitles-options-menu-item');
        item.setAttribute('aria-haspopup', 'true');
        item.append(node('div', 'ytp-menuitem-icon'), node('div', 'ytp-menuitem-label', label), node('div', 'ytp-menuitem-content', '100%'));
        list.append(item);
      }
      const reset = node('div', 'ytp-menuitem');
      reset.append(node('div', 'ytp-menuitem-icon'), node('div', 'ytp-menuitem-label', 'Đặt lại'), node('div', 'ytp-menuitem-content'));
      list.append(reset);
    }
    panel.append(header, list);
    popup.style.display = '';
    popup.firstElementChild.replaceChildren(panel);
  };
  window.closeSettings = () => { popup.style.display = 'none'; };
  const video = player.querySelector('video');
  window.mockTime = 1.5;
  Object.defineProperty(video, 'currentTime', { get: () => window.mockTime, set: (v) => { window.mockTime = v; } });
  // The real player requests the displayed track itself (with its pot token).
  setTimeout(() => {
    fetch('/api/timedtext?v=test123&lang=en&kind=asr&tlang=vi&pot=POT_TOKEN&c=WEB&fmt=json3&signature=SIG_EN')
      .then((r) => r.text());
  }, 200);
</script>
</body>
</html>
